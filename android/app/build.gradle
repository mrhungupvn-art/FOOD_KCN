plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.com11h.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.com11h.app'
        minSdk 23
        targetSdk 36
        versionCode 9
        versionName '1.5.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}
