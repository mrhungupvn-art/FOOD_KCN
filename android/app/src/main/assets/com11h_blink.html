<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
  }
  .stage img {
    display: block;
    width: 100%;
    height: auto;
  }
  .eyelid {
    position: absolute;
    background: radial-gradient(ellipse at 50% 30%, #1c1712 0%, #0a0705 65%, #050403 100%);
    transform-origin: top center;
    transform: scaleY(0);
    pointer-events: none;
    filter: blur(0.3px);
  }
  .eye-left {
    left: 40.5%;
    top: 43.5%;
    width: 8.2%;
    height: 10.5%;
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    animation: blink 4.6s infinite;
  }
  .eye-right {
    left: 52.3%;
    top: 41%;
    width: 8%;
    height: 10%;
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    animation: blink 4.6s infinite;
    animation-delay: 0.02s;
  }
  @keyframes blink {
    0%   { transform: scaleY(0); }
    92%  { transform: scaleY(0); }
    94%  { transform: scaleY(1); }
    97%  { transform: scaleY(1); }
    99%  { transform: scaleY(0); }
    100% { transform: scaleY(0); }
  }
</style>
