name: Check FOOD KCN Keystore Certificate

on:
  workflow_dispatch:

jobs:
  check-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Decode and inspect keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > foodkcn-upload-check.jks

          echo "=== Checking keystore ==="

          keytool -list \
            -v \
            -keystore foodkcn-upload-check.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/certificate-info.txt

          echo
          echo "=== Application Alias ==="
          echo "$KEY_ALIAS"

          echo
          echo "=== Certificate SHA-256 ==="
          grep -A 1 "SHA256:" /tmp/certificate-info.txt || true

          echo
          echo "=== Certificate SHA-1 ==="
          grep -A 1 "SHA1:" /tmp/certificate-info.txt || true

          echo
          echo "=== Certificate MD5 ==="
          grep -A 1 "MD5:" /tmp/certificate-info.txt || true

          echo
          echo "Keystore certificate inspection completed."

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f foodkcn-upload-check.jks
          rm -f /tmp/certificate-info.txt
          echo "Cleanup completed."
