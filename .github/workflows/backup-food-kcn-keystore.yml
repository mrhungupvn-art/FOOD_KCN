name: Secure Backup - FOOD KCN Release Keystore

on:
  workflow_dispatch:

jobs:
  backup-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty or missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is empty or missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: KEY_ALIAS is empty or missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > com11h-release.jks

          # Verify the keystore and required alias without exposing secrets.
          keytool -list \
            -keystore com11h-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            >/tmp/keystore-info.txt

          if ! grep -qF "$KEY_ALIAS" /tmp/keystore-info.txt; then
            echo "ERROR: The configured KEY_ALIAS was not found in the keystore."
            exit 1
          fi

          echo "Keystore decoded successfully."
          echo "Configured alias was verified."

      - name: Encrypt keystore with backup password
        shell: bash
        env:
          BACKUP_PASSWORD: ${{ secrets.KEYSTORE_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_BACKUP_PASSWORD is empty or missing."
            exit 1
          fi

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in com11h-release.jks \
            -out FOOD-KCN-release-keystore.jks.enc \
            -pass env:BACKUP_PASSWORD

          # Remove plaintext keystore immediately.
          shred -u com11h-release.jks

          echo "Encrypted keystore backup created."

      - name: Create recovery information
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          cat > FOOD-KCN-keystore-recovery.txt <<EOF
          FOOD KCN - RELEASE KEYSTORE RECOVERY

          Encrypted keystore:
          FOOD-KCN-release-keystore.jks.enc

          Android applicationId:
          com.foodkcn.app

          Release keystore alias:
          ${KEY_ALIAS}

          Keystore type:
          JKS

          IMPORTANT:
          - The encrypted keystore requires KEYSTORE_BACKUP_PASSWORD.
          - Keep KEYSTORE_PASSWORD and KEY_PASSWORD separately.
          - Do NOT store passwords in Git.
          - Do NOT put any secret into this recovery file.
          - Keep a separate backup of the FOOD KCN source code/project.
          - The signing keystore + passwords do not recreate source code.
          - For future Android updates, keep using the same signing/upload key
            required by the Google Play configuration.
          EOF

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOOD-KCN-release-keystore-backup
          path: |
            FOOD-KCN-release-keystore.jks.enc
            FOOD-KCN-keystore-recovery.txt
          retention-days: 1

      - name: Final cleanup
        if: always()
        shell: bash
        run: |
          rm -f com11h-release.jks
          rm -f /tmp/keystore-info.txt
          echo "Runner cleanup completed."
