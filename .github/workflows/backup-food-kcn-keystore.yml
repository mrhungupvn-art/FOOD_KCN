name: Secure Backup - FOOD KCN Release Keystore

on:
  workflow_dispatch:
    inputs:
      backup_password:
        description: "Mật khẩu mã hóa file backup (.jks.enc) - KHÔNG dùng lại KEYSTORE_PASSWORD"
        required: true
        type: string

jobs:
  backup-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: GitHub Secret KEYSTORE_BASE64 is empty or missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > com11h-release.jks

          # Kiểm tra keystore nhưng KHÔNG in password/secret ra log.
          keytool -list -keystore com11h-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            >/tmp/keystore-info.txt

          if ! grep -q "com11h_shop" /tmp/keystore-info.txt; then
            echo "ERROR: Alias com11h_shop was not found in the keystore."
            exit 1
          fi

          echo "Keystore decoded and alias com11h_shop verified."

      - name: Encrypt keystore
        shell: bash
        env:
          BACKUP_PASSWORD: ${{ inputs.backup_password }}
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_PASSWORD:-}" ]; then
            echo "ERROR: Backup password is empty."
            exit 1
          fi

          # AES-256 + PBKDF2. Không ghi mật khẩu vào file/log.
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in com11h-release.jks \
            -out FOOD-KCN-release-keystore.jks.enc \
            -pass env:BACKUP_PASSWORD

          # Xóa keystore dạng plaintext khỏi runner.
          shred -u com11h-release.jks

          echo "Encrypted keystore created."

      - name: Create recovery information
        shell: bash
        run: |
          set -euo pipefail

          cat > FOOD-KCN-keystore-recovery.txt <<'EOF'
          FOOD KCN - RELEASE KEYSTORE RECOVERY

          Encrypted keystore:
          FOOD-KCN-release-keystore.jks.enc

          Android applicationId:
          com.foodkcn.app

          Release keystore alias:
          com11h_shop

          Keystore type:
          JKS

          IMPORTANT:
          - Keep this encrypted file and its backup password separately.
          - Do NOT store KEYSTORE_PASSWORD or KEY_PASSWORD in this file.
          - Do NOT put any secret/password into Git.
          - The encrypted .jks file alone is not enough to build the app;
            keep the FOOD KCN source code/project as a separate backup.
          - For future updates, use the same release/upload signing key.
          EOF

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOOD-KCN-release-keystore-backup
          path: |
            FOOD-KCN-release-keystore.jks.enc
            FOOD-KCN-keystore-recovery.txt
          retention-days: 1

      - name: Final cleanup
        if: always()
        shell: bash
        run: |
          rm -f com11h-release.jks
          rm -f /tmp/keystore-info.txt
          echo "Runner cleanup completed."
