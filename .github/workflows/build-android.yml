name: Build FOOD KCN Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > com11h-release.jks
          cat > keystore.properties <<EOF
          storeFile=../com11h-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify release signing configuration
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -f keystore.properties ]; then
            echo "ERROR: Missing GitHub Secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD"
            exit 1
          fi
          test -s com11h-release.jks || { echo "ERROR: release keystore is empty"; exit 1; }

          echo "Available aliases in release keystore:"
          keytool -list -keystore com11h-release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | sed -n '1,20p' || true

          if ! keytool -list -keystore com11h-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS_SECRET" >/dev/null 2>&1; then
            echo "ERROR: KEY_ALIAS does not exist in the supplied release keystore."
            echo "The keystore is valid, but GitHub Secret KEY_ALIAS does not match an alias in it."
            exit 1
          fi

            - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FOOD-KCN-v1.8.1-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        working-directory: android
        run: rm -f com11h-release.jks keystore.properties
